[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["talentgraph*"]

[project]
name = "hr-talent-graph"
version = "0.1.0"
description = "An HR skill ontology / knowledge graph with a content-based role recommender, a declarative eligibility rules engine, and a responsible-AI fairness audit, deployed behind a FastAPI service"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
